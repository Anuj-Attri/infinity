[pytest]
# `python -m pytest` puts the working directory on sys.path; bare `pytest` does
# not. Without this, the suite passes locally and dies in CI with
# "No module named 'app'" — the exact class of drift that makes CI worthless.
# Declaring it here means both invocations resolve imports identically.
pythonpath = .
testpaths = tests

# Surface xfail/xpass reasons in the summary. The leak-test markers are
# strict=True, so an unexpected PASS is a failure: the suite is what tells us
# the moment tenancy actually lands, rather than a stale marker hiding it.
addopts = -ra --strict-markers
