name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match infra/Dockerfile. A version drift between CI and the
          # image means CI is green about code that never runs in production.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        # requirements-dev.txt pulls in requirements.txt, then adds pytest.
        # The image installs ONLY requirements.txt, so test-only packages never
        # reach production — and a runtime module that imports one fails here
        # rather than at container boot.
        run: pip install -r requirements-dev.txt

      - name: Tests
        working-directory: backend
        # The leak-test markers are strict=True, so an UNEXPECTED PASS fails the
        # run. That is deliberate: the suite tells us the moment tenancy actually
        # lands, instead of a stale marker hiding it.
        run: pytest -v

      - name: Import the app the way the container does
        working-directory: backend
        # py_compile and pytest both miss this class of failure. With
        # `from __future__ import annotations`, a name used in a Pydantic field
        # type that is not importable in its module gives a clean compile and a
        # RUNTIME 500 at request validation. Importing the real app catches it.
        run: python -c "from app.main import app; print('routes:', len(app.routes))"

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Types
        working-directory: frontend
        run: npm run typecheck

      - name: Security audit
        working-directory: frontend
        # The static half of the frontend gate. The XSS found on 2026-08-21 was
        # produced by the backend but EXECUTED here, so a backend-only gate
        # covers half the path. Fails on: a new dangerouslySetInnerHTML sink, a
        # ReactMarkdown without urlTransform (the default strips custom schemes,
        # which wiped the session), a direct third-party fetch, a hardcoded
        # routable host, a secret-shaped literal, or a desktop-shell import.
        run: npm run audit

  image:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: infinity-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and prove the pipe
        # "It builds" has never once meant "it works" in this project's history.
        # So: start the real image, hit /health, and confirm /echo/stream arrives
        # INCREMENTALLY. A buffering layer turns a live stream into one lump at
        # the end, and that is miserable to diagnose once a model is in the path.
        #
        # SETUP_TOKEN is set so the browser suite below can claim the instance.
        # Without it the container correctly REFUSES first-run setup, because a
        # request arriving over the docker bridge is not loopback — which is the
        # same branch a real internet request lands in.
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 -e SETUP_TOKEN=ci-setup-token -e ACCESS_TOKEN=ci-door-key infinity-backend:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          echo
          echo "--- health ---"
          curl -sf http://127.0.0.1:8000/health || { docker logs api; exit 1; }
          echo
          echo "--- streaming ---"
          start=$(date +%s%N)
          first=""
          curl -sN -X POST http://127.0.0.1:8000/echo/stream \
               -H 'X-Access-Token: ci-door-key' \
               -H 'content-type: application/json' \
               -d '{"text":"one two three four five","delay_ms":200}' \
          | while IFS= read -r line; do
              now=$(date +%s%N)
              echo "$(( (now - start) / 1000000 ))ms  $line"
            done > /tmp/stream.txt
          cat /tmp/stream.txt
          # Five words at 200ms apart cannot finish in under 800ms unless the
          # server ignored the delay; and if the response were buffered, every
          # line would carry a near-identical elapsed time. Assert the last line
          # is meaningfully later than the first.
          firstms=$(head -1 /tmp/stream.txt | cut -dm -f1)
          lastms=$(tail -1 /tmp/stream.txt | cut -dm -f1)
          echo "first=${firstms}ms last=${lastms}ms"
          if [ "$(( lastms - firstms ))" -lt 500 ]; then
            echo "FAIL: response was buffered, not streamed."
            docker logs api
            exit 1
          fi
          echo "OK: arrived incrementally."

          # The image builds the SPA and mounts it at "/". If that stage silently
          # produced nothing, "/" returns {"detail":"Not Found"} and the deploy
          # looks broken to anyone who opens the URL in a browser. Assert the app
          # is actually in there.
          echo
          echo "--- SPA served at / ---"
          root=$(curl -s -H "X-Access-Token: ci-door-key" http://127.0.0.1:8000/)
          echo "$root" | head -c 200; echo
          case "$root" in
            *"<div id=\"root\">"*) echo "OK: SPA is in the image." ;;
            *) echo "FAIL: / did not serve the built frontend."
               docker logs api | grep -i "wire\]" || true
               exit 1 ;;
          esac

          # And the catch-all must not have shadowed the API.
          curl -sf http://127.0.0.1:8000/health >/dev/null \
            || { echo "FAIL: the / mount shadowed /health."; exit 1; }
          echo "OK: /health still reachable behind the SPA mount."

          # The door must actually be shut in the REAL image. A container that
          # answers a stranger is the exact failure this layer exists to
          # prevent, so assert it against the artifact rather than trusting the
          # unit tests alone.
          echo
          echo "--- door ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/auth/status)
          [ "$code" = "404" ] \
            || { echo "FAIL: door open — /auth/status returned $code with no token."
                 exit 1; }
          # "/" sends a person to the door rather than returning a bare JSON
          # 404 they cannot act on. The property that matters is unchanged, and
          # it is what is asserted here: a stranger must NOT get the app.
          root_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$root_code" = "307" ] \
            || { echo "FAIL: / returned $root_code; expected a redirect to the door."
                 exit 1; }
          root_body=$(curl -s http://127.0.0.1:8000/)
          case "$root_body" in
            *'<div id="root">'*)
              echo "FAIL: the SPA is served to anyone — / returned the app itself."
              exit 1 ;;
          esac
          # And the door it lands on must be an entry screen, not a dead end.
          curl -s http://127.0.0.1:8000/access | grep -q 'id="k"' \
            || { echo "FAIL: /access is not a usable entry screen."; exit 1; }
          echo "OK: locked. The app needs the key; only the door is reachable."

          # Skills content must survive .dockerignore. Indexing 0 in the
          # container while working locally is a silent, per-turn quality loss.
          docker logs api 2>&1 | grep -E "skills indexed: [1-9]" \
            || { echo "FAIL: skills indexed 0 in the image."
                 docker logs api 2>&1 | grep -i skills || true
                 exit 1; }
          echo "OK: skills indexed in the image."

          # The boot banner is a diagnostic instrument, so it has to survive.
          # It is the ONLY way to read the deployed region — Railway's API
          # reports region:null forever — and the only way to see the door state
          # when the edge is rate-limiting or the door itself is shut. Both of
          # those happened on 2026-08-21, and between them every other channel
          # was unavailable. A silently-dropped log line would take that away
          # exactly when it is needed.
          echo
          echo "--- boot banner ---"
          docker logs api 2>&1 | grep -E "^\[boot\] host=" \
            || { echo "FAIL: no [boot] environment line."; docker logs api; exit 1; }
          docker logs api 2>&1 | grep -E "^\[boot\] public door: SHUT" \
            || { echo "FAIL: door banner missing or not SHUT despite ACCESS_TOKEN being set."
                 docker logs api 2>&1 | grep -i door || true
                 exit 1; }
          # Whether state survives a redeploy. This container runs without
          # DATA_DIR, so it must say EPHEMERAL — if it ever claims persistence
          # here, the check is reading something other than the real setting.
          docker logs api 2>&1 | grep -E "^\[boot\] state: .*EPHEMERAL" \
            || { echo "FAIL: state banner missing, or wrongly claims persistence with no DATA_DIR."
                 docker logs api 2>&1 | grep -i "boot] state" || true
                 exit 1; }
          # And it must never print the token it is reporting on.
          if docker logs api 2>&1 | grep -q "ci-door-key"; then
            echo "FAIL: the access token appears in the container logs."
            exit 1
          fi
          echo "OK: boot banner present, door SHUT, no token in logs."

      # The container serves the SPA at "/" and the API on the same origin, so
      # this drives the REAL artifact — one process, exactly what deploys — not
      # a dev server pair that only resembles it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the browser harness
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The door, driven the way a person meets it. Every other browser test
      # here presents X-Access-Token, which is the CI path — the waitlist path
      # is /access#<token>, a different code path that shipped untested.
      - name: The waitlist door works, and only for the right key
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8000
          ACCESS_TOKEN: ci-door-key
        run: node e2e/access.mjs

      - name: Every tile opens
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8000
          SETUP_TOKEN: ci-setup-token
          ACCESS_TOKEN: ci-door-key
        run: node e2e/smoke.mjs

      - name: The app actually does things
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8000
          SETUP_TOKEN: ci-setup-token
          ACCESS_TOKEN: ci-door-key
        run: node e2e/functional.mjs

      # The editor must not need the internet. @monaco-editor/react fetches the
      # whole engine from cdn.jsdelivr.net unless loader.config() is called, and
      # it never was — so the shipped app downloaded its editor from a third
      # party on every visit, and showed a permanently blank pane (no error, no
      # timeout) anywhere that host was blocked.
      #
      # audit.mjs could not catch it: the request came from node_modules, via an
      # injected <script>, so a source-level scan for fetch("https://…") was
      # blind twice over. This blocks the network outright and requires the
      # editor to mount, accept typing, and save — a property no string search
      # can assert.
      - name: The editor works with no internet
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8000
          SETUP_TOKEN: ci-setup-token
          ACCESS_TOKEN: ci-door-key
        run: node e2e/editor-offline.mjs

      # The canvas must be usable with fingers, not only a mouse. This is a
      # whole-app capability that no unit test can reach: it needs a real touch
      # pointer stream AND the right CSS, and it was silently absent — the app
      # looked fine because tiles still dragged while the field could not move.
      - name: The canvas moves under a finger
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8000
          SETUP_TOKEN: ci-setup-token
          ACCESS_TOKEN: ci-door-key
        run: node e2e/touch.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs api

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: frontend/e2e/shots/
          retention-days: 7

      - name: Stop the container
        if: always()
        run: docker rm -f api || true
